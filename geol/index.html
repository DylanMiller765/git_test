<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GEOL 1304 Study</title></head>
<body style="margin:0;background:#0b1020;color:#eef3ff;font-family:system-ui"><div id="loading" style="padding:32px">Loading study guide…</div>
<script>
(async()=>{
  const parts=[];
  const base='https://raw.githubusercontent.com/DylanMiller765/git_test/main/geol/';
  for(let i=1;i<=9;i++){
    const n=String(i).padStart(2,'0');
    const r=await fetch(base+'chunk'+n+'.txt?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Failed to load chunk '+n);
    parts.push(await r.text());
  }
  document.open();
  document.write(parts.join(''));
  document.close();
})().catch(e=>{
  const el=document.getElementById('loading');
  if(el) el.textContent='Could not load study guide: '+e.message;
});
</script>
</body>
</html>
